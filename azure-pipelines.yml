
trigger:
  - feature

pool:
  vmImage: ubuntu-22.04

stages:
  - stage: Build
    displayName: Build and Security Scan

    jobs:
      - job: BuildJob
        displayName: Build, Scan, and Push Docker Image

        steps:
          # 1. Scan source code, configuration, and secrets
          - task: trivy@2
            displayName: Trivy Filesystem Scan
            inputs:
              type: filesystem
              target: .
              scanners: vuln,misconfig,secret
              reports: html,json
              publish: true

          # 2. Build a Docker image
          - script: |
              set -eu

              IMAGE="$(imageName):$(version)"

              echo "Building Docker image..."
              docker build --pull --no-cache -t "$IMAGE" .
            displayName: Build Docker Image

          # 3. Generate a detailed image vulnerability report
          - script: |
              set -eu

              IMAGE="$(imageName):$(version)"
              REPORT="$(Build.ArtifactStagingDirectory)/trivy-image-report.json"

              mkdir -p "$(Build.ArtifactStagingDirectory)"

              echo "Generating Trivy image report..."

              trivy image \
                --scanners vuln \
                --format json \
                --output "$REPORT" \
                "$IMAGE"

              echo "=== HIGH and CRITICAL findings ==="

              python3 - "$REPORT" <<'PYTHON'
              import json
              import sys

              with open(sys.argv[1], encoding="utf-8") as file:
                  report = json.load(file)

              count = 0

              for result in report.get("Results", []):
                  for vuln in result.get("Vulnerabilities") or []:
                      if vuln.get("Severity") not in ("HIGH", "CRITICAL"):
                          continue

                      count += 1
                      print(
                          f"{vuln.get('Severity')} | "
                          f"{vuln.get('PkgName')} | "
                          f"Installed: {vuln.get('InstalledVersion')} | "
                          f"Fixed: {vuln.get('FixedVersion')} | "
                          f"ID: {vuln.get('VulnerabilityID')}"
                      )

              if count == 0:
                  print("No HIGH or CRITICAL findings in the report.")

              print(f"Total HIGH/CRITICAL findings: {count}")
              PYTHON
            displayName: Generate Trivy Image Report

          # 4. Publish the diagnostic report
          - publish: $(Build.ArtifactStagingDirectory)/trivy-image-report.json
            artifact: trivy-diagnostic-report
            displayName: Publish Trivy Report
            condition: succeededOrFailed()

          # 5. Block deployment if HIGH or CRITICAL vulnerabilities exist
          - script: |
              set -eu

              IMAGE="$(imageName):$(version)"

              echo "Enforcing Trivy security gate..."

              trivy image \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                "$IMAGE"
            displayName: Trivy Security Gate

          # 6. Tag the image for the registry
          - script: |
              set -eu

              SOURCE_IMAGE="$(imageName):$(version)"
              TARGET_IMAGE="$(target_image)/$(imageName):$(version)"

              docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"

              echo "Tagged image: $TARGET_IMAGE"
            displayName: Tag Docker Image

          # 7. Push only after all previous steps pass
          - script: |
              set -eu

              TARGET_IMAGE="$(target_image)/$(imageName):$(version)"
              REGISTRY="$(acrLoginServer)"

              echo "$(acrPassword)" | docker login "$REGISTRY" \
                --username "$(acrUsername)" \
                --password-stdin

              docker push "$TARGET_IMAGE"

              docker logout "$REGISTRY"
            displayName: Push Docker Image
