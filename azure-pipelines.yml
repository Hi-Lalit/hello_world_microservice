trigger:
  - feature

pool:
  vmImage: 'ubuntu-22.04'

stages:
  - stage: Build
    displayName: 'Build and Security Scan Stage'

    jobs:
      - job: BuildJob
        displayName: 'Build Docker Image'

        steps:
          # 1. Scan source code and configuration files
          - task: trivy@2
            displayName: 'Trivy Filesystem Security Scan'
            inputs:
              type: 'filesystem'
              target: '.'
              scanners: 'vuln,misconfig,secret'
              reports: 'html,json'
              publish: true

          # 2. Build a fresh Docker image
          - script: |
              set -e

              echo "Building Docker image without cache..."

              docker build --pull --no-cache \
                -t "$(imageName):$(version)" .
            displayName: 'Build Docker Image'

          # 3. Diagnose Trivy scanner and image
          - script: |
              set -e

              echo "=== Trivy CLI version, if installed ==="
              if command -v trivy >/dev/null 2>&1; then
                trivy --version
              else
                echo "Trivy CLI is not on PATH; the extension may manage its own scanner."
              fi

              echo "=== Docker image ID ==="
              docker image inspect "$(imageName):$(version)" \
                --format '{{.Id}}'
            displayName: 'Diagnose Trivy Scanner and Image'

          # 4. Diagnose installed Python packages and metadata
          - script: |
              set -e

              IMAGE="$(imageName):$(version)"

              echo "=== Installed Python package metadata ==="

              docker run --rm -i --entrypoint python "$IMAGE" - <<'PYTHON'
              import importlib.metadata as metadata

              packages = ["flask", "msgpack", "setuptools", "urllib3"]

              for package in packages:
                  matches = [
                      (dist.version, str(dist._path))
                      for dist in metadata.distributions()
                      if (dist.metadata.get("Name") or "").lower() == package
                  ]
                  print("{}: {}".format(
                      package,
                      matches if matches else "NOT INSTALLED"
                  ))
              PYTHON

              echo "=== Package metadata directories ==="

              docker run --rm --entrypoint sh "$IMAGE" -c '
                find /usr/local/lib -type d \( \
                  -name "msgpack*.dist-info" -o \
                  -name "setuptools*.dist-info" -o \
                  -name "urllib3*.dist-info" \
                \) -print
              '
            displayName: 'Diagnose Python Package Metadata'

          # 5. Generate a detailed Trivy JSON report
          - script: |
              set -e

              IMAGE="$(imageName):$(version)"

              echo "Generating Trivy vulnerability report..."

              trivy image \
                --scanners vuln \
                --format json \
                --output "$(Build.ArtifactStagingDirectory)/trivy-image-report.json" \
                "$IMAGE"

              echo "=== Vulnerability findings for affected packages ==="

              python3 -c '
              import json

              path = "$(Build.ArtifactStagingDirectory)/trivy-image-report.json"

              with open(path, encoding="utf-8") as f:
                  report = json.load(f)

              for result in report.get("Results", []):
                  for vuln in result.get("Vulnerabilities") or []:
                      if vuln.get("PkgName", "").lower() in {
                          "msgpack", "setuptools", "urllib3"
                      }:
                          print(
                              "Target:", result.get("Target"),
                              "| Package:", vuln.get("PkgName"),
                              "| Installed:", vuln.get("InstalledVersion"),
                              "| Fixed:", vuln.get("FixedVersion"),
                              "| ID:", vuln.get("VulnerabilityID")
                          )
              '
            displayName: 'Generate Trivy Diagnostic Report'

          # 6. Publish the diagnostic report even if a later step fails
          - publish: '$(Build.ArtifactStagingDirectory)/trivy-image-report.json'
            artifact: 'trivy-diagnostic-report'
            displayName: 'Publish Trivy Diagnostic Report'
            condition: succeededOrFailed()

          # 7. Enforce the HIGH/CRITICAL vulnerability gate
          - script: |
              set -e

              echo "Scanning the exact image for HIGH and CRITICAL vulnerabilities..."

              trivy image \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                "$(imageName):$(version)"
            displayName: 'Trivy Docker Image Security Gate'

          # 8. Display available images for debugging
          - script: |
              set -e
              docker images
            displayName: 'Debug Docker Images'

          # 9. Tag image for the container registry
          - script: |
              set -e

              docker tag \
                "$(imageName):$(version)" \
                "$(target_image)/$(imageName):$(version)"
            displayName: 'Tag Docker Image'

          # 10. Login and push only after scans pass
          - script: |
              set -e

              echo "$(acrPassword)" | docker login "$(acrLoginServer)" \
                -u "$(acrUsername)" \
                --password-stdin

              echo "Pushing Docker image to registry..."

              docker push "$(target_image)/$(imageName):$(version)"

              docker logout "$(acrLoginServer)"
            displayName: 'Push Docker Image to Registry'