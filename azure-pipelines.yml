trigger:
  - feature

pool:
  vmImage: 'ubuntu-22.04'

stages:
  - stage: Build
    displayName: 'Build and Security Scan Stage'

    jobs:
      - job: BuildJob
        displayName: 'Build Docker Image'

        steps:
          # 1. Scan source code and configuration files
          - task: trivy@2
            displayName: 'Trivy Filesystem Security Scan'
            inputs:
              type: 'filesystem'
              target: '.'
              scanners: 'vuln,misconfig,secret'
              reports: 'html,json'
              publish: true

          # 2. Build a fresh Docker image
          - script: |
              set -e
              echo "Building Docker image without cache..."

              docker build --pull --no-cache \
                -t "$(imageName):$(version)" .
            displayName: 'Build Docker Image'

          # 3. Verify installed versions and locate duplicate metadata
          - script: |
              set -e

              IMAGE="$(imageName):$(version)"

              echo "=== Image ID ==="
              docker image inspect "$IMAGE" --format '{{.Id}}'

              echo "=== Installed Python package metadata ==="
              docker run --rm --entrypoint python "$IMAGE" -c \
                "import importlib.metadata as m
for p in ['flask', 'msgpack', 'setuptools', 'urllib3']:
    matches = [(d.version, str(d._path)) for d in m.distributions()
               if (d.metadata.get('Name') or '').lower() == p]
    print(f'{p}: {matches or "NOT INSTALLED"}')"

              echo "=== Package metadata directories ==="
              docker run --rm --entrypoint sh "$IMAGE" -c \
                "find /usr/local/lib -type d \( \
                -name 'msgpack*.dist-info' -o \
                -name 'setuptools*.dist-info' -o \
                -name 'urllib3*.dist-info' \
                \) -print"
            displayName: 'Diagnose Python Package Metadata'

          # 4. Scan the exact image that was just built
          - script: |
              set -e

              echo "Scanning Docker image for vulnerabilities..."

              trivy image \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                "$(imageName):$(version)"
            displayName: 'Trivy Docker Image Security Scan'

          # 5. Display available images
          - script: |
              docker images
            displayName: 'Debug Docker Images'

          # 6. Tag image for registry
          - script: |
              set -e

              docker tag \
                "$(imageName):$(version)" \
                "$(target_image)/$(imageName):$(version)"
            displayName: 'Tag Docker Image'

          # 7. Login and push only after scans pass
          - script: |
              set -e

              echo "Logging in to Docker registry..."

              echo "$(acrPassword)" | docker login "$(acrLoginServer)" \
                -u "$(acrUsername)" \
                --password-stdin

              docker push "$(target_image)/$(imageName):$(version)"

              docker logout "$(acrLoginServer)"
            displayName: 'Push Docker Image to Registry'