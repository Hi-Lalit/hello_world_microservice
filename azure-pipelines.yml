trigger:
  - feature

pool:
  vmImage: 'ubuntu-22.04'

stages:
  - stage: Build
    displayName: 'Build and Security Scan Stage'

    jobs:
      - job: BuildJob
        displayName: 'Build Docker Image'

        steps:
          # 1. Scan source code and configuration files
          - task: trivy@2
            displayName: 'Trivy Filesystem Security Scan'
            inputs:
              type: 'filesystem'
              target: '.'
              scanners: 'vuln,misconfig,secret'
              reports: 'html,json'
              publish: true

          # 2. Build a fresh Docker image
          - script: |
              set -eu

              IMAGE="$(imageName):$(version)"

              echo "Building Docker image without cache..."
              docker build --pull --no-cache -t "$IMAGE" .

              echo "=== Built image ID ==="
              docker image inspect "$IMAGE" --format '{{.Id}}'
            displayName: 'Build Docker Image'

          # 3. Diagnose Trivy scanner and image
          - script: |
              set -eu

              echo "=== Trivy CLI version ==="
              trivy --version

              echo "=== Docker image ID ==="
              docker image inspect \
                "$(imageName):$(version)" \
                --format '{{.Id}}'
            displayName: 'Diagnose Trivy Scanner and Image'

          # 4. Check installed Python packages and metadata
          - script: |
              set -eu

              IMAGE="$(imageName):$(version)"

              echo "=== Installed Python package metadata ==="

              docker run --rm -i --entrypoint python "$IMAGE" - <<'PYTHON'
              import importlib.metadata as metadata

              packages = ["flask", "msgpack", "setuptools", "urllib3"]

              for package in packages:
                  matches = [
                      (dist.version, str(dist._path))
                      for dist in metadata.distributions()
                      if (dist.metadata.get("Name") or "").lower() == package
                  ]
                  print("{}: {}".format(
                      package,
                      matches if matches else "NOT INSTALLED"
                  ))
              PYTHON

              echo "=== Matching package metadata directories ==="

              docker run --rm --entrypoint sh "$IMAGE" -c '
                find /usr/local/lib -type d \( \
                  -name "msgpack*.dist-info" -o \
                  -name "setuptools*.dist-info" -o \
                  -name "urllib3*.dist-info" \
                \) -print
              '
            displayName: 'Diagnose Python Package Metadata'

          # 5. Generate a detailed Trivy JSON report
          - script: |
              set -eu

              IMAGE="$(imageName):$(version)"
              REPORT="$(Build.ArtifactStagingDirectory)/trivy-image-report.json"

              mkdir -p "$(Build.ArtifactStagingDirectory)"

              echo "=== Image ID before scanning ==="
              docker image inspect "$IMAGE" --format '{{.Id}}'

              echo "=== Generating Trivy JSON report ==="
              trivy image \
                --scanners vuln \
                --format json \
                --output "$REPORT" \
                "$IMAGE"

              echo "=== HIGH and CRITICAL vulnerability findings ==="

              python3 - "$REPORT" <<'PYTHON'
              import json
              import sys

              with open(sys.argv[1], encoding="utf-8") as file:
                  report = json.load(file)

              found = False

              for result in report.get("Results", []):
                  for vuln in result.get("Vulnerabilities") or []:
                      if vuln.get("Severity") not in ("HIGH", "CRITICAL"):
                          continue

                      found = True
                      print(
                          "Target={target} | Package={package} | "
                          "Installed={installed} | Fixed={fixed} | "
                          "Severity={severity} | ID={vuln_id}".format(
                              target=result.get("Target", ""),
                              package=vuln.get("PkgName", ""),
                              installed=vuln.get("InstalledVersion", ""),
                              fixed=vuln.get("FixedVersion", ""),
                              severity=vuln.get("Severity", ""),
                              vuln_id=vuln.get("VulnerabilityID", "")
                          )
                      )

              if not found:
                  print("No HIGH or CRITICAL vulnerabilities found.")
              PYTHON
            displayName: 'Generate Trivy Diagnostic Report'

          # 6. Publish the report even if a later step fails
          - publish: '$(Build.ArtifactStagingDirectory)/trivy-image-report.json'
            artifact: 'trivy-diagnostic-report'
            displayName: 'Publish Trivy Diagnostic Report'
            condition: succeededOrFailed()

          # 7. Enforce the HIGH/CRITICAL security gate
          - script: |
              set -eu

              IMAGE="$(imageName):$(version)"

              echo "=== Image ID being scanned ==="
              docker image inspect "$IMAGE" --format '{{.Id}}'

              echo "=== Enforcing vulnerability gate ==="
              trivy image \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                "$IMAGE"
            displayName: 'Trivy Docker Image Security Gate'

          # 8. Display local images for debugging
          - script: |
              set -eu
              docker images
            displayName: 'Debug Docker Images'

          # 9. Tag image for the container registry
          - script: |
              set -eu

              SOURCE_IMAGE="$(imageName):$(version)"
              TARGET_IMAGE="$(target_image)/$(imageName):$(version)"

              docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"

              echo "Tagged image: $TARGET_IMAGE"
            displayName: 'Tag Docker Image'

          # 10. Login and push only after scans pass
          - script: |
              set -eu

              TARGET_IMAGE="$(target_image)/$(imageName):$(version)"

              echo "$(acrPassword)" | docker login "$(acrLoginServer)" \
                --username "$(acrUsername)" \
                --password-stdin

              docker push "$TARGET_IMAGE"

              docker logout "$(acrLoginServer)"
            displayName: 'Push Docker Image to Registry'