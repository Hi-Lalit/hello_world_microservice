trigger:
- feature

pool: 
  vmImage: 'ubuntu-22.04'

stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildJob
    displayName: 'Build Docker Image'
    steps:
    - script: |
        echo "Building Docker image..."
        docker build -t $(imageName) .
      displayName: 'Build Docker Image'

    - script: |
        echo "Available local Docker images:"
        docker images
      displayName: 'Debug Docker Images'

    - script: |
        echo "Tagging Docker image for registry..."
        docker tag $(imageName) $(target_image)/$(imageName):$(version)
      displayName: 'Tag Docker Image for Registry'

    - script: |
        echo "Logging in to Docker registry..."
        echo "$(acrPassword)" | docker login $(acrLoginServer) -u $(acrUsername) --password-stdin

        echo "Pushing Docker image to registry..."
        docker push $(target_image)/$(imageName):$(version)
      displayName: 'Push Docker Image to Registry'     