
trigger:
  - feature

pool:
  vmImage: 'ubuntu-22.04'

stages:
  - stage: Build
    displayName: 'Build and Security Scan Stage'

    jobs:
      - job: BuildJob
        displayName: 'Build Docker Image'

        steps:
          # 1. Scan source code and configuration files
          - task: trivy@2
            displayName: 'Trivy Filesystem Security Scan'
            inputs:
              type: 'filesystem'
              target: '.'
              scanners: 'vuln,misconfig,secret'

          # 2. Build Docker image
          - script: |
              set -e
              echo "Building Docker image..."
              docker build -t "$(imageName):$(version)" .
            displayName: 'Build Docker Image'

          # 3. Scan the built Docker image
          - script: |
              set -e
              echo "Scanning Docker image for vulnerabilities..."

              trivy image \
                --scanners vuln,misconfig,secret \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                "$(imageName):$(version)"
            displayName: 'Trivy Docker Image Security Scan'

          # 4. Display available images
          - script: |
              echo "Available local Docker images:"
              docker images
            displayName: 'Debug Docker Images'

          # 5. Tag image for registry
          - script: |
              set -e
              echo "Tagging Docker image for registry..."

              docker tag \
                "$(imageName):$(version)" \
                "$(target_image)/$(imageName):$(version)"
            displayName: 'Tag Docker Image'

          # 6. Login and push image to registry
          - script: |
              set -e
              echo "Logging in to Docker registry..."

              echo "$(acrPassword)" | docker login "$(acrLoginServer)" \
                -u "$(acrUsername)" \
                --password-stdin

              echo "Pushing Docker image to registry..."
              docker push "$(target_image)/$(imageName):$(version)"

              docker logout "$(acrLoginServer)"
            displayName: 'Push Docker Image to Registry'
